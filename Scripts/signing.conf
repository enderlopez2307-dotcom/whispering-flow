# Signing configuration for local personal builds.
#
# No paid Apple Developer Program membership is used or required.
# See TECH_RESEARCH.md 14 for the experiment that chose this value, and
# TECH_DECISIONS.md ADR-011 for the reasoning.
#
# WF_SIGN_IDENTITY must name a certificate that exists in the login keychain
# and, critically, must STAY THE SAME across rebuilds. TCC keys every granted
# permission to the code signature; changing identity forfeits all grants.

WF_SIGN_IDENTITY="Whispering Flow Local Signing"
WF_BUNDLE_ID="com.whisperingflow.dictation"
